# SMS Spam Classification Fine-Tuning Configuration

model:
  vocab_size: 50257
  context_length: 1024
  emb_dim: 768
  n_heads: 12
  n_layers: 12
  drop_rate: 0.0
  qkv_bias: true
  num_classes: 2

training:
  batch_size: 8
  learning_rate: 0.00005
  weight_decay: 0.1
  num_epochs: 5
  eval_freq: 50
  eval_iter: 5
  seed: 123
