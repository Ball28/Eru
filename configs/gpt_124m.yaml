# Standard GPT-2 (124M) Model Configuration
# Matches OpenAI GPT-2 small architecture

vocab_size: 50257
context_length: 1024
emb_dim: 768
n_heads: 12
n_layers: 12
drop_rate: 0.1
qkv_bias: false

# Training defaults
batch_size: 2
learning_rate: 0.0004
weight_decay: 0.1
num_epochs: 10
eval_freq: 5
eval_iter: 1
