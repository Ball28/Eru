# Instruction Fine-Tuning (SFT) Configuration (Chapter 7)

model:
  vocab_size: 50257
  context_length: 1024
  emb_dim: 768
  n_heads: 12
  n_layers: 12
  drop_rate: 0.0
  qkv_bias: true

training:
  batch_size: 8
  learning_rate: 0.00005
  weight_decay: 0.1
  num_epochs: 2
  eval_freq: 5
  eval_iter: 5
  seed: 123
  pad_token_id: 50256
  ignore_index: -100
